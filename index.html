<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Para May - Galaxia de Amor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: #1a0a0a;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        /* PANTALLA DE APERTURA */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ffe0e8 0%, #ffdab9 100%);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #splash h1 {
            font-size: clamp(2.2rem, 10vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 2px;
            color: #a0526b;
            text-shadow: 0 6px 20px rgba(255, 150, 180, 0.3);
            margin-bottom: 2rem;
            text-align: center;
            padding: 0 1rem;
        }
        #btnAbrir {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.8rem;
            padding: 1.2rem 2.8rem;
            border-radius: 60px;
            background: #ff8da1;
            color: #fff;
            font-weight: 600;
            letter-spacing: 1.5px;
            box-shadow: 0 0 30px #ff8da1aa, 0 0 60px #ff6b81aa;
            animation: latidoBoton 1.8s infinite ease-in-out;
        }
        #btnAbrir:hover { transform: scale(1.05); background: #ff6b81; }
        @keyframes latidoBoton {
            0% { box-shadow: 0 0 20px #ff8da1aa; transform: scale(1); }
            50% { box-shadow: 0 0 50px #ff6b81ee, 0 0 80px #ff85a2aa; transform: scale(1.04); }
            100% { box-shadow: 0 0 20px #ff8da1aa; transform: scale(1); }
        }

        /* CARGA */
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #0f0510;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffe0e8;
            transition: opacity 0.6s;
        }
        #loadingScreen.active { display: flex; }
        #loadingScreen .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                        radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                        radial-gradient(2px 2px at 50px 160px, #ddd, transparent),
                        radial-gradient(2px 2px at 90px 40px, #fff, transparent),
                        radial-gradient(2px 2px at 130px 80px, #fff, transparent);
            background-size: 200px 200px;
            opacity: 0.3;
            animation: caerEstrellas 4s linear infinite;
        }
        @keyframes caerEstrellas {
            from { transform: translateY(-10%); }
            to { transform: translateY(10%); }
        }
        .loader-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        #heartLoader {
            width: 100px; height: 100px;
            position: relative;
            cursor: pointer;
        }
        #heartLoader canvas {
            width: 100%; height: 100%;
            display: block;
        }
        #progressCircle {
            width: 140px; height: 140px;
            position: relative;
        }
        #progressCircle svg {
            transform: rotate(-90deg);
            width: 140px; height: 140px;
        }
        #progressCircle circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }
        .bg-circle { stroke: #3a1a2a; }
        .progress-circle {
            stroke: #ff8da1;
            stroke-dasharray: 380;
            stroke-dashoffset: 380;
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 8px #ff6b81);
        }
        .chispas {
            position: absolute;
            inset: -20px;
            pointer-events: none;
            background: radial-gradient(circle, #ffb6c1 2px, transparent 3px);
            background-size: 25px 25px;
            opacity: 0.4;
            animation: girarChispas 8s linear infinite;
        }
        @keyframes girarChispas {
            from { transform: rotate(0); }
            to { transform: rotate(360deg); }
        }
        #loadingText {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #ffb6c1;
            font-weight: 300;
        }

        /* GALAXIA EN HTML PURO */
        #galaxia {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: none;
            background: #0f0510;
            overflow: hidden;
        }
        #galaxia.active { display: block; }

        /* CORAZÓN DE PARTÍCULAS EN CSS */
        .corazon-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            animation: latido 1.5s ease-in-out infinite;
        }
        @keyframes latido {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            14% { transform: translate(-50%, -50%) scale(1.08); }
            28% { transform: translate(-50%, -50%) scale(1); }
            42% { transform: translate(-50%, -50%) scale(1.08); }
            70% { transform: translate(-50%, -50%) scale(1); }
        }
        .particula {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: orbitar 8s linear infinite;
        }
        @keyframes orbitar {
            0% { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }

        /* MENSAJE CENTRAL */
        #mensajeCentral {
            position: fixed;
            z-index: 35;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            max-width: 90vw;
            line-height: 1.3;
            animation: brilloMensaje 2s ease-in-out infinite alternate;
            display: none;
        }
        #mensajeCentral .linea1 {
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 800;
            color: #FFB6C1;
            text-shadow: 0 0 30px #ff6b81, 0 0 60px #ff85a2, 0 0 90px #ffb6c1;
            display: block;
            letter-spacing: 2px;
        }
        #mensajeCentral .linea2 {
            font-size: clamp(1.6rem, 4vw, 3rem);
            font-weight: 700;
            color: #FFD1DC;
            text-shadow: 0 0 30px #ff6b81, 0 0 60px #ff85a2;
            display: block;
            margin-top: 0.2rem;
            letter-spacing: 1px;
        }
        #mensajeCentral .linea3 {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            font-weight: 600;
            color: #FFDAB9;
            text-shadow: 0 0 30px #ff85a2, 0 0 50px #ff6b81;
            display: block;
            margin-top: 0.2rem;
        }
        #mensajeCentral .linea4 {
            font-size: clamp(2rem, 4.5vw, 3.2rem);
            font-weight: 800;
            color: #FF6B81;
            text-shadow: 0 0 40px #ff6b81, 0 0 80px #ff85a2, 0 0 120px #ffb6c1;
            display: block;
            margin-top: 0.3rem;
            letter-spacing: 2px;
        }
        @keyframes brilloMensaje {
            0% { filter: brightness(1) drop-shadow(0 0 20px #ff6b81); }
            100% { filter: brightness(1.2) drop-shadow(0 0 40px #ff85a2); }
        }

        /* FRASES ORBITANDO */
        .frase {
            position: fixed;
            z-index: 40;
            color: #ffd1dc;
            font-size: 1.1rem;
            font-weight: 500;
            text-shadow: 0 0 20px #ff85a2, 0 0 40px #ff6b81;
            cursor: pointer;
            background: rgba(20, 10, 15, 0.4);
            backdrop-filter: blur(6px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #ffb6c155;
            transition: 0.2s;
            pointer-events: auto;
            white-space: nowrap;
            animation: orbitarFrases 12s linear infinite;
        }
        .frase:hover { transform: scale(1.1); background: rgba(255, 200, 210, 0.2); }

        @keyframes orbitarFrases {
            0% { transform: rotate(0deg) translateX(250px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(250px) rotate(-360deg); }
        }

        /* PALABRAS CLAVE */
        .palabra-clave {
            position: fixed;
            z-index: 50;
            color: #ffd1dc;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 0 0 20px #ff85a2, 0 0 40px #ff6b81;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #ffb6c177;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
            pointer-events: auto;
        }
        .palabra-clave:hover {
            transform: scale(1.1);
            background: rgba(255, 200, 210, 0.2);
            border-color: #ff8da1;
            box-shadow: 0 0 30px #ff6b8166;
        }

        /* IMÁGENES FLOTANDO */
        .img-flotante {
            position: fixed;
            z-index: 30;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(255, 107, 129, 0.3), 0 0 0 2px rgba(255, 182, 193, 0.3);
            object-fit: cover;
            animation: orbitarImagenes 15s linear infinite;
            opacity: 0.85;
            pointer-events: none;
            width: 100px;
            height: 100px;
        }
        @keyframes orbitarImagenes {
            0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
        }

        /* LLUVIA */
        .lluvia-item {
            position: fixed;
            z-index: 20;
            pointer-events: none;
            font-size: 1.5rem;
            animation: caerLluvia linear forwards;
            opacity: 0.9;
            text-shadow: 0 0 20px rgba(255, 107, 129, 0.5);
        }
        @keyframes caerLluvia {
            0% { transform: translateY(-100px) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 0.9; transform: translateY(0px) rotate(10deg) scale(1); }
            90% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        /* REPRODUCTOR */
        #musicPlayer {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(30, 10, 20, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            border: 1px solid #ffb6c155;
            min-width: 200px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #musicPlayer.minimizado { min-width: 50px; border-radius: 40px; padding: 6px 12px; }
        #musicPlayer.minimizado .controles, #musicPlayer.minimizado .info-cancion,
        #musicPlayer.minimizado .volumen-slider, #musicPlayer.minimizado .barra-progreso { display: none; }
        .player-btn {
            background: none; border: none; color: #ffb6c1; font-size: 1.5rem;
            cursor: pointer; padding: 4px; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .player-btn:hover { background: #ffb6c133; color: #ff8da1; }
        .info-cancion { font-size: 0.8rem; color: #ffd1dc; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .barra-progreso { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 100px; }
        .barra-progreso input[type="range"] {
            width: 100%; height: 4px; -webkit-appearance: none;
            background: #3a1a2a; border-radius: 4px; outline: none;
        }
        .barra-progreso input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #ff8da1; cursor: pointer;
            box-shadow: 0 0 10px #ff6b81;
        }
        .tiempo { font-size: 0.7rem; color: #ffb6c1; min-width: 36px; }
        .volumen-slider { display: flex; align-items: center; gap: 6px; }
        .volumen-slider input[type="range"] { width: 50px; height: 4px; -webkit-appearance: none; background: #3a1a2a; border-radius: 4px; }
        .volumen-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #ff8da1; cursor: pointer; }
        .toggle-min { background: none; border: none; color: #ffb6c1; font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
        .lista-canciones {
            background: rgba(20, 10, 15, 0.9); backdrop-filter: blur(8px); border-radius: 16px;
            padding: 8px; position: absolute; bottom: 70px; right: 0; display: none;
            flex-direction: column; gap: 4px; border: 1px solid #ffb6c155; min-width: 150px;
        }
        .lista-canciones.active { display: flex; }
        .lista-canciones button { background: none; border: none; color: #ffd1dc; padding: 6px 12px; text-align: left; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 0.85rem; }
        .lista-canciones button:hover { background: #ffb6c122; color: #fff; }

        /* MENSAJE EMERGENTE */
        .mensaje-emergente {
            position: fixed;
            z-index: 200;
            background: linear-gradient(145deg, #fff5f7, #ffe8ed);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 28px 32px;
            max-width: 420px;
            min-width: 240px;
            box-shadow: 0 20px 60px rgba(255, 107, 129, 0.3), 0 0 0 2px #ffb6c1, 0 0 0 4px #ffd1dc, 0 0 40px rgba(255, 182, 193, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #5a2d3a;
            font-size: 1rem;
            line-height: 1.7;
            animation: aparecerCarta 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .mensaje-emergente::before { content: '💖'; position: absolute; top: -15px; left: -15px; font-size: 2rem; animation: flotarCorazon 2s ease-in-out infinite; }
        .mensaje-emergente::after { content: '✨'; position: absolute; bottom: -15px; right: -15px; font-size: 1.8rem; animation: flotarCorazon 2s ease-in-out infinite 0.5s; }
        @keyframes flotarCorazon { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(10deg); } }
        @keyframes aparecerCarta { from { opacity: 0; transform: scale(0.7) translateY(30px) rotate(-5deg); } to { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); } }
        .mensaje-emergente .cerrar {
            position: absolute; top: 8px; right: 14px; background: none; border: none;
            font-size: 1.4rem; color: #a0526b; cursor: pointer; transition: 0.2s;
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 182, 193, 0.2);
        }
        .mensaje-emergente .cerrar:hover { background: rgba(255, 107, 129, 0.3); transform: rotate(90deg); }
        .mensaje-emergente .titulo-msg { font-size: 1.2rem; font-weight: 700; color: #ff6b81; margin-bottom: 8px; display: block; text-align: center; }
        .mensaje-emergente .contenido-msg { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .mensaje-emergente .texto-msg { color: #5a2d3a; font-size: 0.95rem; line-height: 1.6; text-align: center; }
        .mensaje-emergente .polaroid { width: 120px; height: 120px; border-radius: 16px; object-fit: cover; box-shadow: 0 4px 15px rgba(255, 107, 129, 0.3), 0 0 0 3px #fff, 0 0 0 4px #ffb6c1; transition: transform 0.3s ease; background: #fff; padding: 4px; }
        .mensaje-emergente .polaroid:hover { transform: scale(1.05) rotate(-2deg); }
        .mensaje-emergente .polaroid-container { position: relative; display: inline-block; }
        .mensaje-emergente .polaroid-container::after { content: '📸'; position: absolute; bottom: -8px; right: -8px; font-size: 1.2rem; background: rgba(255, 255, 255, 0.9); border-radius: 50%; padding: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .mensaje-emergente .decoracion { display: flex; gap: 6px; justify-content: center; margin-top: 8px; font-size: 1.2rem; }

        @media (max-width: 600px) {
            #musicPlayer { bottom: 12px; right: 12px; padding: 6px 10px; min-width: 150px; gap: 6px; }
            .player-btn { font-size: 1.2rem; width: 30px; height: 30px; }
            .info-cancion { max-width: 70px; font-size: 0.7rem; }
            .barra-progreso input[type="range"] { width: 60px; }
            .volumen-slider input[type="range"] { width: 30px; }
            .mensaje-emergente { max-width: 300px; padding: 20px 16px; font-size: 0.9rem; }
            .mensaje-emergente .polaroid { width: 80px; height: 80px; }
            #btnAbrir { font-size: 1.2rem; padding: 0.8rem 1.8rem; }
            #mensajeCentral .linea1 { font-size: clamp(1.4rem, 4.5vw, 2.2rem); }
            #mensajeCentral .linea2 { font-size: clamp(1.2rem, 3.5vw, 1.8rem); }
            #mensajeCentral .linea3 { font-size: clamp(0.9rem, 2.5vw, 1.3rem); }
            #mensajeCentral .linea4 { font-size: clamp(1.4rem, 4vw, 2rem); }
            .mensaje-emergente::before, .mensaje-emergente::after { font-size: 1.4rem; }
            .mensaje-emergente::before { top: -12px; left: -12px; }
            .mensaje-emergente::after { bottom: -12px; right: -12px; }
        }
    </style>
</head>
<body>

<!-- ===== PANTALLA DE APERTURA ===== -->
<div id="splash">
    <h1 id="tituloSplash">Para May, con todo mi amor</h1>
    <button id="btnAbrir">❤️ Abrir regalo</button>
</div>

<!-- ===== CARGA ===== -->
<div id="loadingScreen">
    <div class="stars"></div>
    <div class="loader-content">
        <div id="heartLoader">
            <canvas id="loaderCanvas" width="100" height="100"></canvas>
        </div>
        <div id="progressCircle">
            <svg viewBox="0 0 140 140">
                <circle class="bg-circle" cx="70" cy="70" r="60" />
                <circle class="progress-circle" id="progressCircleFill" cx="70" cy="70" r="60" />
            </svg>
            <div class="chispas"></div>
        </div>
        <div id="loadingText">Cargando galaxia...</div>
    </div>
</div>

<!-- ===== GALAXIA ===== -->
<div id="galaxia">
    <!-- Corazón de partículas (CSS puro) -->
    <div class="corazon-container" id="corazonContainer"></div>

    <!-- Mensaje central -->
    <div id="mensajeCentral">
        <span class="linea1">♥︎ Te AMO mushísimo ♥︎</span>
        <span class="linea2">mi bella niñita siempre PERFECTA</span>
        <span class="linea3">de todito mi korashon</span>
        <span class="linea4">HEHE (≧▽≦)/ ♥︎</span>
    </div>

    <!-- Frases y palabras clave se crean con JavaScript -->
    <!-- Imágenes flotando se crean con JavaScript -->
</div>

<!-- ===== REPRODUCTOR ===== -->
<div id="musicPlayer">
    <button class="toggle-min" id="toggleMinimizar">◀</button>
    <span class="info-cancion" id="nombreCancion">🎵 Sin canción</span>
    <button class="player-btn" id="btnPlayPause">▶</button>
    <button class="player-btn" id="btnRetroceder">⏪</button>
    <button class="player-btn" id="btnAdelantar">⏩</button>
    <div class="barra-progreso">
        <span class="tiempo" id="tiempoActual">0:00</span>
        <input type="range" id="progressBar" min="0" max="1" step="0.001" value="0" />
        <span class="tiempo" id="tiempoTotal">0:00</span>
    </div>
    <div class="volumen-slider">
        <span>🔊</span>
        <input type="range" id="volumenControl" min="0" max="1" step="0.05" value="0.7" />
    </div>
    <button class="player-btn" id="btnLista">📋</button>
    <div class="lista-canciones" id="listaCanciones"></div>
</div>

<script>
    // ================================================================
    //  CONFIGURACIÓN CENTRALIZADA
    // ================================================================
    const CONFIG = {
        nombre: "May",
        frases: [
            "Eres mi universo, May",
            "Cada latido es por ti",
            "May, mi corazón baila contigo",
            "Eres la luz de mi galaxia",
            "Contigo, eternidad",
            "Eres mi sueño hecho realidad",
            "Tu sonrisa ilumina mi mundo",
            "Eres mi razón de ser"
        ],
        mensajesLargos: {
            "Eres mi universo, May": {
                texto: "May, desde que llegaste a mi vida, cada estrella brilla con tu nombre. Eres el centro de todo mi cosmos, mi sol, mi luna y todas mis estrellas. 🌟💖",
                img: "msg_foto1.webp"
            },
            "Cada latido es por ti": {
                texto: "Cada latido de mi corazón tiene tu nombre, May. Late por ti, late para ti, late contigo. Eres mi ritmo, mi melodía, mi canción de amor eterna. 🎵❤️",
                img: "msg_foto2.webp"
            },
            "May, mi corazón baila contigo": {
                texto: "Cuando estoy contigo, mi corazón baila al ritmo de tu sonrisa. Eres mi melodía favorita, la canción que nunca quiero dejar de escuchar. 💃✨",
                img: "msg_foto3.webp"
            },
            "Eres la luz de mi galaxia": {
                texto: "Tu luz ilumina incluso los rincones más oscuros de mi ser. Gracias por existir, May. Eres el faro que guía mi camino. 🌠💫",
                img: "msg_foto4.webp"
            },
            "Contigo, eternidad": {
                texto: "Contigo, el tiempo se detiene y la eternidad se vuelve un instante. Te amo, May. Quiero pasar todas mis vidas a tu lado. ♾️💕",
                img: "msg_foto5.webp"
            },
            "Eres mi sueño hecho realidad": {
                texto: "Cada noche soñaba contigo, y ahora despierto a tu lado. Eres mi sueño hecho realidad, mi deseo cumplido, mi mayor bendición. 🌙✨",
                img: "msg_foto6.webp"
            },
            "Tu sonrisa ilumina mi mundo": {

    function mostrarCarga() {
        const loading = document.getElementById('loadingScreen');
        loading.classList.add('active');
        const canvas = document.getElementById('loaderCanvas');
        const ctx = canvas.getContext('2d');
        let progreso = 0;
        const duracion = CONFIG.duracionCarga * 1000;
        const inicio = Date.now();
        let acelerado = false;

        function dibujarCorazon(prog) {
            ctx.clearRect(0, 0, 100, 100);
            const cx = 50, cy = 50;
            const total = 300;
            const filled = Math.floor(prog * total);
            const colores = CONFIG.colores;
            for (let i = 0; i < total; i++) {
                const t = i / total;
                const ang = t * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(ang), 3);
                const y = 13 * Math.cos(ang) - 5 * Math.cos(2*ang) - 2 * Math.cos(3*ang) - Math.cos(4*ang);
                const px = cx + x * 2.2;
                const py = cy - y * 2.2;
                const size = (i < filled) ? 2.5 : 1.2;
                const color = colores[i % colores.length];
                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fillStyle = (i < filled) ? color : '#3a1a2a';
                ctx.shadowColor = (i < filled) ? '#ff8da1' : 'transparent';
                ctx.shadowBlur = (i < filled) ? 8 : 0;
                ctx.fill();
            }
            if (prog > 0.2) {
                const pulso = 1 + Math.sin(Date.now() / 300) * 0.03 * (prog);
                ctx.save();
                ctx.translate(50, 50);
                ctx.scale(pulso, pulso);
                ctx.translate(-50, -50);
                ctx.restore();
            }
        }

        function actualizarCarga() {
            const ahora = Date.now();
            const elapsed = ahora - inicio;
            let prog = Math.min(elapsed / duracion, 1);
            if (acelerado) prog = Math.min(prog + 0.03, 1);

            const circle = document.getElementById('progressCircleFill');
            const offset = 380 - (380 * prog);
            circle.style.strokeDashoffset = offset;
            dibujarCorazon(prog);

            document.getElementById('loadingText').textContent = 
                prog < 1 ? `Cargando galaxia... ${Math.round(prog*100)}%` : '¡Listo! 💫';

            if (prog < 1) {
                requestAnimationFrame(actualizarCarga);
            } else {
                setTimeout(() => {
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        loading.classList.remove('active');
                        iniciarGalaxia();
                    }, 600);
                }, 300);
            }
        }

        document.getElementById('heartLoader').addEventListener('click', () => {
            acelerado = true;
        });

        actualizarCarga();
    }

    // ================================================================
    //  REPRODUCTOR DE MÚSICA
    // ================================================================
    function configurarReproductor() {
        const btnPlay = document.getElementById('btnPlayPause');
        const btnRetro = document.getElementById('btnRetroceder');
        const btnAdel = document.getElementById('btnAdelantar');
        const progress = document.getElementById('progressBar');
        const tiempoAct = document.getElementById('tiempoActual');
        const tiempoTot = document.getElementById('tiempoTotal');
        const volControl = document.getElementById('volumenControl');
        const btnLista = document.getElementById('btnLista');
        const listaContainer = document.getElementById('listaCanciones');
        const nombreCancion = document.getElementById('nombreCancion');
        const toggleMin = document.getElementById('toggleMinimizar');
        const player = document.getElementById('musicPlayer');

        cancionesLista = CONFIG.canciones.map((c, i) => ({
            nombre: c.replace('.mp3', '').replace(/_/g, ' '),
            archivo: 'music/' + c,
            index: i
        }));

        cancionesLista.forEach((cancion) => {
            const btn = document.createElement('button');
            btn.textContent = cancion.nombre;
            btn.addEventListener('click', () => {
                reproducirCancion(cancion.index);
                listaContainer.classList.remove('active');
            });
            listaContainer.appendChild(btn);
        });

        if (cancionesLista.length > 0) {
            audio.src = cancionesLista[0].archivo;
            audio.load();
            nombreCancion.textContent = '🎵 ' + cancionesLista[0].nombre;
        }

        btnPlay.addEventListener('click', () => {
            if (audio.src) {
                if (isPlaying) {
                    audio.pause();
                    btnPlay.textContent = '▶';
                } else {
                    audio.play().catch(() => {});
                    btnPlay.textContent = '⏸';
                }
                isPlaying = !isPlaying;
            }
        });

        btnRetro.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        });

        btnAdel.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = audio.currentTime / audio.duration;
                progress.value = pct;
                tiempoAct.textContent = formatTime(audio.currentTime);
                tiempoTot.textContent = formatTime(audio.duration);
            }
        });

        progress.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = parseFloat(progress.value) * audio.duration;
            }
        });

        volControl.addEventListener('input', () => {
            audio.volume = parseFloat(volControl.value);
        });
        audio.volume = 0.7;

        btnLista.addEventListener('click', (e) => {
            e.stopPropagation();
            listaContainer.classList.toggle('active');
        });
        document.addEventListener('click', () => {
            listaContainer.classList.remove('active');
        });

        toggleMin.addEventListener('click', () => {
            player.classList.toggle('minimizado');
            toggleMin.textContent = player.classList.contains('minimizado') ? '▶' : '◀';
        });

        audio.addEventListener('ended', () => {
            const currentIndex = cancionesLista.findIndex(c => c.archivo === audio.src);
            if (currentIndex < cancionesLista.length - 1) {
                reproducirCancion(currentIndex + 1);
            } else {
                mostrarMensajeEmergente('💖 Amor Eterno 💖', 'May, esta canción termina, pero nuestro amor no. Cada nota es un latido que te dedico, y aunque la música se detenga, mi corazón seguirá cantando por ti. 🎵💕', null,
                    window.innerWidth / 2 - 150, window.innerHeight / 2 - 50);
                btnPlay.textContent = '▶';
                isPlaying = false;
                audio.currentTime = 0;
                progress.value = 0;
                tiempoAct.textContent = '0:00';
            }
        });

        function reproducirCancion(index) {
            const cancion = cancionesLista[index];
            if (!cancion) return;
            audio.src = cancion.archivo;
            audio.load();
            audio.play().catch(() => {});
            isPlaying = true;
            btnPlay.textContent = '⏸';
            nombreCancion.textContent = '🎵 ' + cancion.nombre;
            document.querySelectorAll('#listaCanciones button').forEach((btn, i) => {
                btn.style.background = i === index ? '#ffb6c133' : '';
            });
        }

        window.reproducirCancion = reproducirCancion;
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function animar() {
        requestAnimationFrame(animar);

        // Actualizar posiciones de imágenes flotando (orbitar)
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const time = Date.now() / 1000;

        imagenesOrbitando.forEach((img, index) => {
            const angulo = img.angulo + time * img.velocidad;
            const x = Math.cos(angulo) * img.radio;
            const y = Math.sin(angulo) * img.radio * 0.7;
            img.elemento.style.transform = `translate(${x}px, ${y}px)`;
            img.elemento.style.left = centerX + 'px';
            img.elemento.style.top = centerY + 'px';
        });
    }

            div.style.transition = 'all 2s ease-out';
            div.style.opacity = '1';
            div.style.transform = 'translate(0, 0) scale(1)';
            div.style.textShadow = '0 0 30px #ff85a2, 0 0 60px #ff6b81';
            document.body.appendChild(div);

            const ang = Math.random() * Math.PI * 2;
            const dist = 80 + Math.random() * 200;
            const dx = Math.cos(ang) * dist;
            const dy = Math.sin(ang) * dist - 50;

            requestAnimationFrame(() => {
                div.style.transform = `translate(${dx}px, ${dy}px) scale(0.2)`;
                div.style.opacity = '0';
            });

            setTimeout(() => {
                if (div.parentNode) div.remove();
            }, 2200);
        }
    });

    // ================================================================
    //  INICIO
    // ================================================================
    window.addEventListener('DOMContentLoaded', iniciar);
</script>
</body>
</html>
